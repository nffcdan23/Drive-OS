kind = "mobile"
previewPath = "/"
title = "DriveOS"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev:replit"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "replit:build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "replit:serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
