# Build tool versions for Railway (railpack provisions its toolchain with mise).
#
# Railway was installing pnpm 9.15.9, which does not read the `overrides` block
# from pnpm-workspace.yaml. It therefore saw no overrides in the config while
# pnpm-lock.yaml records sixty of them, and refused the install with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. The `packageManager` field in package.json
# did not override that, so the version is stated here where mise will read it.
#
# pnpm must stay in step with whatever generated pnpm-lock.yaml; if the lockfile
# is ever regenerated by a different pnpm, update this pin to match.

[tools]
node = "22.22.2"
pnpm = "10.33.0"
