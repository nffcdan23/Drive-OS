name: Supabase staging deploy

# Applies supabase/migrations to the STAGING Supabase project and verifies it
# against the real Auth, Data API and Storage services. Never production.
#
# main is the canonical branch: migrations are applied only from main. The
# read-only probe and the test runs (which delete everything they create) may
# also run from claude/** branches.
#
# Runs only when deliberately triggered:
#   * a commit whose message contains
#     "[deploy supabase-staging]" (deploy, main only), "[probe supabase-staging]"
#     (read-only probe plus the rollback-only Storage policy proof — cannot
#     apply migrations or leave anything behind) or "[api-test supabase-staging]"
#     (runs the Express API on the runner against staging and exercises it
#     with real Auth tokens and Storage; applies no migrations and deletes
#     everything it creates), "[mobile-test supabase-staging]" (runs the
#     app's data layer end to end against staging: accounts, sign-in,
#     vehicles, photos, places, journeys, offline handling, deletion), or
#   * "Run workflow" (type deploy-staging to deploy from main, mobile-test to
#     run only the app tests, or auth-config for the read-only Auth settings).
# Every other push shows this workflow as skipped.
#
# Stops at the first step that fails: nothing is applied unless the read-only
# pre-flight passes, and the verification suites that write test data run
# inside transactions that are always rolled back.
#
# Secrets are passed through environment variables only and never echoed;
# GitHub masks them in logs, and the database password and user tokens are
# masked explicitly as well.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-staging to apply the migrations to the STAGING project, mobile-test to only run the app tests, or auth-config to show the Auth settings (read-only)'
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  probe:
    name: Staging probe (read-only + rollback-only policy proof)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe supabase-staging]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret is set
        run: |
          [ -n "$STAGING_DB_URL" ] || { echo "::error::SUPABASE_STAGING_DB_URL is not set"; exit 1; }
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          echo "Database secret is set."

      - name: Pre-flight (read-only transaction)
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/preflight.sql

      - name: Storage ownership probe (read-only transaction)
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/storage_probe.sql

      - name: Storage policy proof (rollback only)
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/storage_policy_proof.sql

      - name: Verify the proof left nothing behind (read-only)
        if: always()
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/storage_policy_proof_verify.sql

  deploy:
    name: Deploy and verify staging
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy supabase-staging]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy-staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Deploy only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Migrations are applied only from main (this run is on $GITHUB_REF). Merge first."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check the required secrets are set
        run: |
          missing=0
          for name in STAGING_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Mask the database password on its own as well as the full URL.
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          # Guard against pointing this workflow at the wrong project.
          case "$SUPABASE_URL" in
            "https://$SUPABASE_PROJECT_REF.supabase.co"|"https://$SUPABASE_PROJECT_REF.supabase.co/") ;;
            *) echo "::error::SUPABASE_STAGING_URL does not match SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          case "$STAGING_DB_URL" in
            *"$SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::SUPABASE_STAGING_DB_URL is not for SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          echo "All required secrets are set and refer to the same project."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-client-16

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # fresh: first deployment to an empty project. incremental: the history
      # on staging must be exactly the first N repository migrations, with
      # newer ones pending (anything else stops here; see preflight.sql).
      - name: Pre-flight (read-only transaction)
        run: |
          repo_versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | paste -sd, -)
          psql "$STAGING_DB_URL" -X -q -v repo_versions="$repo_versions" -f supabase/tests/staging/preflight.sql

      - name: Deployment mode (read-only)
        id: mode
        run: |
          recorded=$(psql "$STAGING_DB_URL" -X -A -t -c "select case when to_regclass('supabase_migrations.schema_migrations') is null then 0 else (select count(*) from supabase_migrations.schema_migrations) end")
          mode=$([ "$recorded" = "0" ] && echo fresh || echo incremental)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Deployment mode: $mode ($recorded migrations already recorded)"

      - name: Storage policy proof (rollback only)
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/storage_policy_proof.sql

      - name: Verify the proof left nothing behind (read-only)
        run: psql "$STAGING_DB_URL" -X -q -f supabase/tests/staging/storage_policy_proof_verify.sql

      - name: Show the migrations that will be applied (dry run)
        run: supabase db push --db-url "$STAGING_DB_URL" --dry-run

      - name: Apply migrations to staging
        # The CLI asks for confirmation before applying; answer it non-interactively.
        run: echo y | supabase db push --db-url "$STAGING_DB_URL"

      - name: Confirm every migration is recorded
        run: |
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(psql "$STAGING_DB_URL" -X -A -t -c "select count(*) from supabase_migrations.schema_migrations")
          echo "Migrations in repo: $expected, recorded on staging: $applied"
          [ "$expected" = "$applied" ]
          # The same versions, not just the same number
          repo=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | paste -sd, -)
          staging=$(psql "$STAGING_DB_URL" -X -A -t -c "select string_agg(version, ',' order by version) from supabase_migrations.schema_migrations")
          [ "$repo" = "$staging" ] || { echo "::error::Recorded versions differ from the repository: $staging"; exit 1; }
          echo "Recorded versions match the repository exactly."

      # The smoke and RLS suites assert exact row counts over their own
      # fixtures, so they need an empty database: they run on a first
      # deployment (and on every change, against a throwaway database, in
      # database.yml). An incremental deployment runs incremental_verify.sql.
      - name: Schema smoke tests (inside a rolled-back transaction)
        if: steps.mode.outputs.mode == 'fresh'
        run: |
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -c 'begin' -f supabase/tests/local/10_schema_smoke.sql -c 'rollback' 2>&1 \
            | sed -e 's/^psql:[^ ]* NOTICE:  /    /' -e 's/^NOTICE:  /    /'
          exit "${PIPESTATUS[0]}"

      - name: RLS and security tests (inside a rolled-back transaction)
        if: steps.mode.outputs.mode == 'fresh'
        run: |
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -c 'begin' -f supabase/tests/local/20_rls_security.sql -c 'rollback' 2>&1 \
            | sed -e 's/^psql:[^ ]* NOTICE:  /    /' -e 's/^NOTICE:  /    /'
          exit "${PIPESTATUS[0]}"

      - name: Snapshot before verification (read-only)
        if: steps.mode.outputs.mode == 'incremental'
        id: before
        run: |
          snapshot=$(psql "$STAGING_DB_URL" -X -A -t -c "
            select concat_ws(',', (select count(*) from auth.users), (select count(*) from public.profiles),
                                  (select count(*) from public.friendships), (select count(*) from public.user_blocks),
                                  (select count(*) from public.user_presence), (select count(*) from private.storage_delete_queue))")
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "Row counts before verification: $snapshot"

      - name: Incremental verification (inside a rolled-back transaction)
        if: steps.mode.outputs.mode == 'incremental'
        run: |
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -c 'begin' -f supabase/tests/staging/incremental_verify.sql -c 'rollback' 2>&1 \
            | sed -e 's/^psql:[^ ]* NOTICE:  /    /' -e 's/^NOTICE:  /    /'
          exit "${PIPESTATUS[0]}"

      - name: Confirm the verification left nothing behind
        if: steps.mode.outputs.mode == 'incremental'
        run: |
          after=$(psql "$STAGING_DB_URL" -X -A -t -c "
            select concat_ws(',', (select count(*) from auth.users), (select count(*) from public.profiles),
                                  (select count(*) from public.friendships), (select count(*) from public.user_blocks),
                                  (select count(*) from public.user_presence), (select count(*) from private.storage_delete_queue))")
          extra=$(psql "$STAGING_DB_URL" -X -A -t -c "
            select (select count(*) from auth.users where email like '%@example.test')
                 + (select count(*) from information_schema.role_table_grants
                      where table_schema = 'public' and grantee in ('anon', 'authenticated'))
                 + (select count(*) from realtime.messages where topic like 'inbox:f1e5e0c0-0000-4000-8000-0000000000a%')")
          echo "Row counts after: $after (before: ${{ steps.before.outputs.snapshot }}); test users / client grants / test messages: $extra"
          [ "$after" = "${{ steps.before.outputs.snapshot }}" ] && [ "$extra" = "0" ]

      - name: Confirm the test transactions left nothing behind
        if: steps.mode.outputs.mode == 'fresh'
        run: |
          leftovers=$(psql "$STAGING_DB_URL" -X -A -t -c "
            select (select count(*) from auth.users where email like '%@example.test')
                 + (select count(*) from public.profiles)
                 + (select count(*) from storage.objects where bucket_id in
                      ('avatars','community-media','vehicle-photos','journey-photos','location-photos','vehicle-documents'))
                 + (select count(*) from private.storage_delete_queue)
                 + (select count(*) from information_schema.role_table_grants
                      where table_schema = 'public' and grantee in ('anon', 'authenticated'))")
          echo "Leftover test rows / client grants: $leftovers"
          [ "$leftovers" = "0" ]

      - name: Live checks against Auth, Data API and Storage
        run: node supabase/tests/staging/api_checks.mjs

      - name: Security Advisor
        run: node supabase/tests/staging/security_advisor.mjs

  api-test:
    name: Express API against staging
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[api-test supabase-staging]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are set
        run: |
          missing=0
          for name in STAGING_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          case "$SUPABASE_URL" in
            "https://$SUPABASE_PROJECT_REF.supabase.co"|"https://$SUPABASE_PROJECT_REF.supabase.co/") ;;
            *) echo "::error::SUPABASE_STAGING_URL does not match SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          case "$STAGING_DB_URL" in
            *"$SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::SUPABASE_STAGING_DB_URL is not for SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          echo "All required secrets are set and refer to the same project."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-client-16

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the API
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build

      - name: Confirm staging has every migration (read-only)
        run: |
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(psql "$STAGING_DB_URL" -X -A -t -c "select count(*) from supabase_migrations.schema_migrations")
          echo "Migrations in repo: $expected, recorded on staging: $applied"
          [ "$expected" = "$applied" ]

      - name: Run the API against staging
        run: node supabase/tests/staging/api_staging.mjs

  mobile-test:
    name: Mobile app data layer against staging
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[mobile-test supabase-staging]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'mobile-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are set
        run: |
          missing=0
          for name in STAGING_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          case "$SUPABASE_URL" in
            "https://$SUPABASE_PROJECT_REF.supabase.co"|"https://$SUPABASE_PROJECT_REF.supabase.co/") ;;
            *) echo "::error::SUPABASE_STAGING_URL does not match SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          case "$STAGING_DB_URL" in
            *"$SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::SUPABASE_STAGING_DB_URL is not for SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          echo "All required secrets are set and refer to the same project."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-client-16

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the API; typecheck and unit-test the app
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/mobile run typecheck
          pnpm --filter @workspace/mobile run test

      - name: Confirm staging has every migration (read-only)
        run: |
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(psql "$STAGING_DB_URL" -X -A -t -c "select count(*) from supabase_migrations.schema_migrations")
          echo "Migrations in repo: $expected, recorded on staging: $applied"
          [ "$expected" = "$applied" ]

      - name: Run the app's data layer against staging
        env:
          # Optional repository variable (not a secret): domain for sign-up test addresses.
          SIGNUP_TEST_EMAIL_DOMAIN: ${{ vars.STAGING_SIGNUP_EMAIL_DOMAIN }}
        run: pnpm --filter @workspace/mobile run test:staging

  # Read-only: shows how staging Auth is configured for sign-in from the app
  # and Expo Go (Run workflow with confirm = auth-config). Prints only
  # non-secret settings; never keys, secrets or tokens.
  auth-config:
    name: Staging Auth configuration (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'auth-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Auth settings that affect the app
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set: redirect URLs can't be read; showing public settings only."
          else
            curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > auth.json || { echo "::error::Could not read the Auth config"; exit 1; }
            python3 - <<'PY'
          import json
          c = json.load(open("auth.json"))
          allow = [u.strip() for u in (c.get("uri_allow_list") or "").split(",") if u.strip()]
          print("Site URL:            ", c.get("site_url"))
          print("Redirect URLs:       ", allow or "(none)")
          print("Email sign-in:       ", c.get("external_email_enabled"))
          print("Confirm email:       ", not c.get("mailer_autoconfirm"))
          print("Sign-ups disabled:   ", c.get("disable_signup"))
          print("Google enabled:      ", c.get("external_google_enabled"))
          print("Google client ID set:", bool(c.get("external_google_client_id")))
          print("Google secret set:   ", bool(c.get("external_google_secret")))
          print("Apple enabled:       ", c.get("external_apple_enabled"))
          expo_go = any(u.startswith("exp://") for u in allow)
          print("Expo Go redirect (exp://…) allowed:", expo_go)
          print("App redirect (starscale-drive-staging://…) allowed:", any(u.startswith("starscale-drive-staging://") for u in allow))
          PY
            rm -f auth.json
          fi
          echo "Public settings: $(curl -s "${SUPABASE_URL%/}/auth/v1/settings" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" | python3 -c 'import sys,json;d=json.load(sys.stdin);print({k:v for k,v in d.get("external",{}).items() if v}, "autoconfirm:", d.get("mailer_autoconfirm"), "signup disabled:", d.get("disable_signup"))')"

      - name: Which redirect Supabase accepts (no browser, nothing followed)
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          # Starts a Google sign-in for each candidate redirect, then reads the
          # redirect Supabase recorded for that sign-in (auth.flow_state,
          # found by its unique code challenge). Site URL there = rejected.
          # The probe's own flow_state rows are deleted afterwards.
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          # The project ref is masked in logs, so compare instead of printing it.
          for ref in nshffzncumvmmzgtqqph; do
            case "$SUPABASE_URL" in *"$ref"*) echo "Probing project $ref: yes (the staging secrets point at it)" ;; *) echo "::warning::The staging secrets do NOT point at project $ref" ;; esac
          done
          cols=$(psql "$STAGING_DB_URL" -X -A -t -c "select string_agg(column_name, ',') from information_schema.columns where table_schema='auth' and table_name='flow_state'")
          echo "auth.flow_state columns: $cols"
          challenges=""
          for asked in "exp://192.168.0.162:8081/--/auth/callback" "exp://192.168.0.162:8081" "starscale-drive-staging://auth/callback" "https://example.invalid/not-allowed"; do
            challenge=$(python3 -c 'import os,hashlib,base64;v=base64.urlsafe_b64encode(os.urandom(32)).rstrip(b"=");print(base64.urlsafe_b64encode(hashlib.sha256(v).digest()).rstrip(b"=").decode())')
            challenges="$challenges'$challenge',"
            host=$(curl -s -o /dev/null -w '%{redirect_url}' -G "${SUPABASE_URL%/}/auth/v1/authorize" \
              --data-urlencode provider=google --data-urlencode "redirect_to=$asked" \
              --data-urlencode "code_challenge=$challenge" --data-urlencode code_challenge_method=s256 \
              | python3 -c 'import sys,urllib.parse as u;print(u.urlsplit(sys.stdin.read()).netloc or "-")')
            case ",$cols," in
              *,referrer,*) ref=$(psql "$STAGING_DB_URL" -X -A -t -c "select coalesce(referrer,'(null)') from auth.flow_state where code_challenge = '$challenge'") ;;
              *) ref="(flow_state has no referrer column)" ;;
            esac
            if [ "$ref" = "$asked" ]; then verdict="ACCEPTED"; else verdict="NOT accepted"; fi
            printf '%-45s google=%-20s recorded redirect=%s  %s\n' "$asked" "$host" "$ref" "$verdict"
          done
          psql "$STAGING_DB_URL" -X -q -c "delete from auth.flow_state where code_challenge in (${challenges%,})" && echo "Probe sign-in attempts removed."
