# Deploys the Express API to the hosted STAGING service (its own Railway
# project, separate from production) and tests the mobile data layer against it.
#
# Runs only when asked:
#   - a push whose commit message contains  [deploy api-staging]
#   - or "Run workflow" with confirm = deploy-api-staging
#   - "Run workflow" with confirm = verify-api-staging runs only the read-only
#     checks below and changes nothing
#
# Production is out of reach by construction:
#   - RAILWAY_STAGING_TOKEN is a Railway *project token*, which Railway scopes to
#     one project and one environment. Create it in the staging project only.
#   - Every Railway command names the project, environment and service
#     explicitly (the CLI can otherwise create a new project), and the job
#     refuses to deploy unless the token resolves to RAILWAY_STAGING_PROJECT_ID
#     and that project's name contains "staging".
#   - Every Supabase value comes from the SUPABASE_STAGING_* secrets and is
#     checked to belong to the same staging project before anything changes.
#   - The Railway build settings are added to the uploaded copy only; there is
#     no railway.json at the repository root, so production's builds are unaffected.
name: API staging deploy

on:
  push:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-api-staging" to deploy the API to hosted staging, or "verify-api-staging" for the read-only checks only'
        required: true

permissions:
  contents: read

concurrency:
  group: api-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the API to hosted staging
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy api-staging]')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.confirm == 'deploy-api-staging' || inputs.confirm == 'verify-api-staging'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_STAGING_PROJECT_ID }}
      # Fixed on purpose: deploys go only to environment "staging", service "api".
      RAILWAY_ENVIRONMENT: staging
      RAILWAY_SERVICE: api
      MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'verify-api-staging') && 'verify' || 'deploy' }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      # Pinned and more than a week old, like the workspace's minimumReleaseAge rule.
      RAILWAY_CLI_VERSION: 5.57.6
    steps:
      - uses: actions/checkout@v4

      - name: Install the Railway CLI
        run: |
          npm install --global --no-audit --no-fund "@railway/cli@$RAILWAY_CLI_VERSION"
          railway --version
          echo "::group::railway up --help"; railway up --help || true; echo "::endgroup::"
          echo "::group::railway variables --help"; railway variables --help || true; echo "::endgroup::"

      - name: Check the secrets and that they all point at staging
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID STAGING_API_URL STAGING_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (see artifacts/mobile/docs/STAGING_API.md)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          password=$(python3 -c "import os,urllib.parse as u; print(u.unquote(u.urlsplit(os.environ['STAGING_DB_URL']).password or ''))")
          [ -n "$password" ] && echo "::add-mask::$password"
          case "$SUPABASE_URL" in
            "https://$SUPABASE_PROJECT_REF.supabase.co"|"https://$SUPABASE_PROJECT_REF.supabase.co/") ;;
            *) echo "::error::SUPABASE_STAGING_URL does not match SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          case "$STAGING_DB_URL" in
            *"$SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::SUPABASE_STAGING_DB_URL is not for SUPABASE_STAGING_PROJECT_REF"; exit 1 ;;
          esac
          case "$STAGING_API_URL" in
            https://*) ;;
            *) echo "::error::STAGING_API_URL must be an https:// URL"; exit 1 ;;
          esac
          echo "Secrets are set and refer to the same Supabase staging project."

      - name: Confirm the token, project, environment and service (read-only)
        # Runs even if the step above found a problem, so every issue is reported
        # at once; deploy steps below still need every check to pass.
        if: ${{ !cancelled() && env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != '' }}
        run: |
          railway status --json > "$RUNNER_TEMP/railway-status.json"
          python3 - "$RUNNER_TEMP/railway-status.json" <<'PY'
          import json, os, sys
          want = os.environ["RAILWAY_PROJECT_ID"]
          status = json.load(open(sys.argv[1]))
          def find_project(o):
              if isinstance(o, dict):
                  if o.get("id") == want and isinstance(o.get("name"), str):
                      return o
                  for v in o.values():
                      r = find_project(v)
                      if r: return r
              elif isinstance(o, list):
                  for v in o:
                      r = find_project(v)
                      if r: return r
              return None
          def names_under(o, word, inside=False, out=None):
              out = set() if out is None else out
              if isinstance(o, dict):
                  if inside and isinstance(o.get("name"), str):
                      out.add(o["name"])
                  for k, v in o.items():
                      names_under(v, word, inside or word in k.lower(), out)
              elif isinstance(o, list):
                  for v in o:
                      names_under(v, word, inside, out)
              return out
          project = find_project(status)
          fail = lambda msg: (print(f"::error::{msg}; refusing to continue."), sys.exit(1))
          if not project:
              fail("The Railway token does not belong to RAILWAY_STAGING_PROJECT_ID")
          envs = names_under(project, "environment")
          services = names_under(project, "service")
          print(f"Railway project: {project['name']}")
          print(f"Environments: {sorted(envs)}")
          print(f"Services: {sorted(services)}")
          if "staging" not in project["name"].lower():
              fail(f'Project "{project["name"]}" does not have "staging" in its name')
          if os.environ["RAILWAY_ENVIRONMENT"] not in envs:
              fail('The project has no environment named "staging"')
          if os.environ["RAILWAY_SERVICE"] not in services:
              fail('The project has no service named "api"')
          print("Token, project, environment and service verified.")
          PY
          rm -f "$RUNNER_TEMP/railway-status.json"
          # The token can read the target service's settings (names only are shown).
          railway variables -p "$RAILWAY_PROJECT_ID" -e "$RAILWAY_ENVIRONMENT" -s "$RAILWAY_SERVICE" --json \
            | python3 -c '
          import json, os, sys, urllib.parse
          d = json.load(sys.stdin)
          if not isinstance(d, dict):
              print("::error::Unexpected variables format"); sys.exit(1)
          print("Current variable names on staging/api:", sorted(d))
          # STAGING_API_URL must be this service'"'"'s own public domain.
          url = os.environ["STAGING_API_URL"]
          host = urllib.parse.urlsplit(url if "://" in url else "//" + url).hostname
          domain = d.get("RAILWAY_PUBLIC_DOMAIN")
          print(f"STAGING_API_URL host: {host}; staging/api public domain: {domain}")
          if not domain or host != domain.lower():
              print("::error::STAGING_API_URL is not the public domain of the staging api service"); sys.exit(1)
          '

      - name: Read-only checks passed; nothing was changed
        if: env.MODE == 'verify'
        run: echo "verify-api-staging mode stops here."

      - uses: pnpm/action-setup@v4
        if: env.MODE == 'deploy'

      - uses: actions/setup-node@v4
        if: env.MODE == 'deploy'
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        if: env.MODE == 'deploy'
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the API before deploying
        if: env.MODE == 'deploy'
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build

      - name: Set the staging service's variables (staging values only)
        if: env.MODE == 'deploy'
        run: |
          put() {  # value on stdin, never on the command line or in the log
            railway variables -p "$RAILWAY_PROJECT_ID" -e "$RAILWAY_ENVIRONMENT" -s "$RAILWAY_SERVICE" \
              --skip-deploys --set-from-stdin "$1" > /dev/null
          }
          printf '%s' production | put NODE_ENV
          printf '%s' info | put LOG_LEVEL
          printf '%s' "$STAGING_DB_URL" | put DATABASE_URL
          printf '%s' "${SUPABASE_URL%/}" | put SUPABASE_URL
          printf '%s' "$SUPABASE_SECRET_KEY" | put SUPABASE_SECRET_KEY
          printf '%s' 5000 | put STORAGE_WORKER_INTERVAL_MS
          printf '%s' "$GITHUB_SHA" | put APP_RELEASE
          echo "Variables set (values not shown)."

      - name: Deploy this commit
        if: env.MODE == 'deploy'
        run: |
          # Upload a clean copy of the commit with the staging build settings added.
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          git archive HEAD | tar -x -C "$dir"
          cp deploy/railway.staging.json "$dir/railway.json"
          cd "$dir"
          railway up -p "$RAILWAY_PROJECT_ID" -e "$RAILWAY_ENVIRONMENT" -s "$RAILWAY_SERVICE" --ci \
            --message "staging $GITHUB_SHA"

      - name: Show Railway build and deploy logs (on failure)
        if: failure() && env.MODE == 'deploy'
        run: |
          r() { railway "$@" -p "$RAILWAY_PROJECT_ID" -e "$RAILWAY_ENVIRONMENT" -s "$RAILWAY_SERVICE"; }
          echo "::group::railway logs --help"; railway logs --help || true; echo "::endgroup::"
          echo "::group::Deployments"; r deployment list || true; echo "::endgroup::"
          echo "::group::Build log"; r logs --build --lines 300 || true; echo "::endgroup::"
          echo "::group::Deploy log"; r logs --deployment --lines 200 || true; echo "::endgroup::"

      - name: Wait until this commit is serving
        if: env.MODE == 'deploy'
        run: |
          url="${STAGING_API_URL%/}"
          for i in $(seq 1 60); do
            release=$(curl -s -D - -o /dev/null "$url/api/healthz" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-release"{print $2}')
            if [ "$release" = "$GITHUB_SHA" ]; then echo "Serving $release"; break; fi
            echo "Waiting (serving: ${release:-nothing yet})"; sleep 10
          done
          [ "$release" = "$GITHUB_SHA" ] || { echo "::error::The hosted API is not serving this commit"; exit 1; }
          ready=$(curl -s "$url/api/readyz")
          echo "readyz: $ready"
          [ "$ready" = '{"status":"ok","database":"ok"}' ]

      - name: Install PostgreSQL client
        if: env.MODE == 'deploy'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-client-16

      - name: Test the app's data layer against the hosted staging API
        if: env.MODE == 'deploy'
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
          SIGNUP_TEST_EMAIL_DOMAIN: ${{ vars.STAGING_SIGNUP_EMAIL_DOMAIN }}
        run: pnpm --filter @workspace/mobile run test:staging
