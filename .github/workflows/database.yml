name: Database

# Verifies the Supabase migrations on every pull request that touches the
# database, entirely inside the CI runner: a throwaway PostgreSQL + PostGIS
# instance, schema smoke tests, the Drizzle drift check, the RLS/security
# test suite and the API integration tests (against a fake Storage/Auth
# server with test-only tokens). It never connects to Supabase, Railway or any other database,
# and uses no secrets.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'lib/db/**'
      - 'artifacts/api-server/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/**'
      - 'lib/db/**'
      - 'artifacts/api-server/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Migrations, RLS, security and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 16 and PostGIS
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-16 postgresql-16-postgis-3
          # Only the binaries are needed; the tests start their own throwaway cluster.
          sudo systemctl stop postgresql || true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the database package and API
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck

      - name: Verify migrations, RLS, security and the API
        run: pnpm run db:verify-local
